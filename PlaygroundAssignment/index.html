<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exploration Gallery</title>
  <link rel="stylesheet" href="Style/style.css">
</head>
<body>

  <h1 class="title">Exploration Gallery</h1>

  <div class="gallery">
    <div class="card">
      <img src="Images/city.jpeg" alt="Historic city building under cloudy sky">
      <div class="card-content">
        <h2>City</h2>
        <p>Washington DC.</p>
        <a href="#">View More</a>
      </div>
    </div>

    <div class="card">
      <img src="Images/house.jpeg" alt="Sunlight shining through abandoned roof">
      <div class="card-content">
        <h2>Abandoned</h2>
        <p>House exploration.</p>
        <a href="#">View More</a>
      </div>
    </div>

    <div class="card">
      <img src="Images/window.jpeg" alt="Broken dusty window inside abandoned building">
      <div class="card-content">
        <h2>Window</h2>
        <p>Abandoned.</p>
        <a href="#">View More</a>
      </div>
    </div>

    <div class="card">
      <img src="Images/tv.jpeg" alt="Old televisions inside abandoned room">
      <div class="card-content">
        <h2>Forgotten Tech</h2>
        <p>Abandoned.</p>
        <a href="#">View More</a>
      </div>
    </div>

    <div class="card">
      <img src="Images/beaver.jpeg" alt="Two beavers swimming in water">
      <div class="card-content">
        <h2>Wildlife </h2>
        <p>wildlife.</p>
        <a href="#">View More</a>
      </div>
    </div>

    <div class="card">
      <img src="Images/cow.jpeg" alt="Black and white portrait of a cow">
      <div class="card-content">
        <h2>Black &amp; White</h2>
        <p>Nature.</p>
        <a href="#">View More</a>
      </div>
    </div>
  </div>

</body>
</html>
